                        </div>
						<div class="form-group" align="center"><button class="Next btn btn-success btn-lg">Next</button><b style="color:#fff;font-size: 20pt; padding: 20px">or</b> <button data-toggle="modal" data-target="#myModal"class="Login btn btn-warning btn-lg">Login</button></div>

<script>

$('.Next').click(function(){
			$('.SpecityAgent').addClass('inactive');
			$('.LoginInfo').removeClass('inactive');

})

$('.Next2').click(function(){
	if($('#Username1').val().trim()==""){
		$('#Username1').attr('placeholder', 'Username Required');
		$('#Username1').addClass('hasError');
	}else{
	$('#Username1').removeClass('hasError');
	}
	if($('#Password1').val().trim()==""){
		$('#Password1').attr('placeholder', 'Password Required');
		$('#Password1').addClass('hasError');
	}else{
	$('#Password1').removeClass('hasError');
	}	
	
	
	
	if($('#Username1').val().trim()!="" && $('#Password1').val().trim()!=""){
			$('.LoginInfo').addClass('inactive');
			$('.PersonalInfo').removeClass('inactive');

	}
})

$('.Submit').click(function(){
var Username=$('#Username1').val();
var Password=$('#Password1').val();
var First_Name=$('.First_Name').val();
var Email=$('.Email').val();
var Phone=$('.Phone').val();
var Agent_id=$('.Agent_id').val();
var Boss=$('.boss').val();
if(Agent_id==""){
	$('Agent_id').attr('placeholder','Specify your Agent');
	$('Agent_id').addClass('hasError');
}
$.ajax({
url:'createAgent.php',
method:'POST',
data:{Boss:Boss, Agent_id:Agent_id, Username:Username, Password:Password, First_Name:First_Name, Email:Email,Phone:Phone},
success:function(data){
$('.Status').html(data);
}

})
})


</script>
